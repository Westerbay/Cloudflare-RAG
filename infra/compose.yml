services:
  db:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_USER: rag
      POSTGRES_DB: rag
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD:?Set a private database password}
    volumes:
      - rag_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [rag_private]
    restart: unless-stopped

  embeddings:
    image: ghcr.io/ggml-org/llama.cpp:server-b10015@sha256:6bc9134e3278a0ecab23d7ef2f6a46b4595740014fe9bc2f67e8ba7dca8395b4
    command: ["--model", "/models/Qwen3-Embedding-0.6B-Q8_0.gguf", "--alias", "qwen3-embedding-0.6b", "--host", "0.0.0.0", "--port", "8080", "--embedding", "--pooling", "last", "--ctx-size", "2048", "--parallel", "1", "--threads", "4"]
    volumes:
      - ../models:/models:ro
    networks: [rag_private]
    restart: unless-stopped

  chat:
    image: ghcr.io/ggml-org/llama.cpp:server-b10015@sha256:6bc9134e3278a0ecab23d7ef2f6a46b4595740014fe9bc2f67e8ba7dca8395b4
    command: ["--model", "/models/${RAG_CHAT_GGUF_FILE:-Qwen3.5-2B-Q4_K_M.gguf}", "--alias", "${RAG_CHAT_MODEL:-qwen3.5-2b}", "--host", "0.0.0.0", "--port", "8080", "--ctx-size", "4096", "--parallel", "1", "--threads", "4", "--jinja"]
    volumes:
      - ../models:/models:ro
    networks: [rag_private]
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      RAG_DATABASE_URL: ${RAG_DATABASE_URL:?Set a private URL for the rag database}
      RAG_CORPUS_ROOT: /app/data/corpus
      RAG_CHAT_URL: http://chat:8080
      RAG_EMBEDDING_URL: http://embeddings:8080
      RAG_CHAT_MODEL: ${RAG_CHAT_MODEL:-qwen3.5-2b}
      RAG_EMBEDDING_MODEL: qwen3-embedding-0.6b
      RAG_SYSTEM_PROMPT_PATH: /app/prompts/system.md
      RAG_SOUL_PATH: /app/prompts/SOUL.md
    volumes:
      - ../data/corpus:/app/data/corpus:ro
      - ../prompts:/app/prompts:ro
    depends_on:
      db:
        condition: service_healthy
      chat:
        condition: service_started
      embeddings:
        condition: service_started
    networks: [rag_private]
    restart: unless-stopped

volumes:
  rag_db:

networks:
  rag_private:
    internal: true
